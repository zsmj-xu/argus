# Shannon discovery-only configuration for a complete local crAPI deployment.

description: >
  OWASP crAPI multi-service benchmark. The source root for a run may be workshop
  or community, but the live URL must expose the complete matching crAPI deployment.
  The OpenAPI specification is available in the source repository.

vuln_classes: [injection, xss, auth, authz, ssrf]
exploit: "false"

authentication:
  login_type: api
  login_url: "http://host.docker.internal:8888/identity/api/auth/login"
  credentials:
    username: "argus.crapi@example.com"
    password: "Test!123"
  login_flow:
    - "Ensure the test user exists by POSTing /identity/api/auth/signup with email argus.crapi@example.com, name Argus Test, number 1234567890, and password Test!123; an already registered response is acceptable."
    - "POST /identity/api/auth/login with JSON {\"email\":\"argus.crapi@example.com\",\"password\":\"Test!123\"}."
    - "Extract the JWT token from the login response and send Authorization: Bearer <token>."
  success_condition:
    type: text_contains
    value: "token"

rules:
  focus:
    - {description: "Workshop order and coupon APIs", type: url_path, value: "/workshop/api"}
    - {description: "Community post and coupon APIs", type: url_path, value: "/community/api"}
    - {description: "Management APIs", type: url_path, value: "/workshop/api/management"}
  avoid: []

rules_of_engagement: |
  This must point to an isolated local crAPI deployment with disposable test data.
  Discovery only: exploit=false. Do not modify accounts other than the test account.

pipeline:
  max_concurrent_pipelines: 1
