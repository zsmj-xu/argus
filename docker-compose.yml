services:
  api:
    build:
      context: .
      args:
        OPENCODEREVIEW_VERSION: codex/argus-aligned-refactor
        OPENCODEREVIEW_COMMIT: 072808b6b0b12a1408b31889539c03878eff0f61
        OPENCODEREVIEW_REPOSITORY: https://github.com/zsmj-xu/open-code-review.git
    image: argus-white-box:local
    command: ["argus", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${ARGUS_BIND:-127.0.0.1}:8000:8000"
    environment:
      ARGUS_API_KEY: ${ARGUS_API_KEY:?set ARGUS_API_KEY}
      ARGUS_DATA_DIR: /var/lib/argus
      ARGUS_FRONTEND_DIR: /app/frontend/dist
      ARGUS_SCAN_DB: ${ARGUS_SCAN_DB:-}
      ARGUS_EVENT_RETENTION_DAYS: ${ARGUS_EVENT_RETENTION_DAYS:-14}
      ARGUS_EVENT_LIMIT: ${ARGUS_EVENT_LIMIT:-10000}
      ARGUS_ACTIVITY_WARN_SECONDS: ${ARGUS_ACTIVITY_WARN_SECONDS:-120}
      ARGUS_ACTIVITY_STALE_SECONDS: ${ARGUS_ACTIVITY_STALE_SECONDS:-300}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:?set ARGUS_LLM_BASE_URL}
      ARGUS_LLM_API_KEY: ${ARGUS_LLM_API_KEY:?set ARGUS_LLM_API_KEY}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:?set ARGUS_LLM_MODEL}
      ARGUS_LLM_PROTOCOL: ${ARGUS_LLM_PROTOCOL:-openai}
      OCR_BINARY: ${OCR_BINARY:-/usr/local/bin/ocr}
    volumes:
      - argus-service-data:/var/lib/argus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: argus-white-box:local
    depends_on:
      api:
        condition: service_healthy
    command: ["argus", "worker"]
    environment:
      ARGUS_DATA_DIR: /var/lib/argus
      ARGUS_SCAN_DB: ${ARGUS_SCAN_DB:-}
      ARGUS_EVENT_RETENTION_DAYS: ${ARGUS_EVENT_RETENTION_DAYS:-14}
      ARGUS_EVENT_LIMIT: ${ARGUS_EVENT_LIMIT:-10000}
      ARGUS_ACTIVITY_WARN_SECONDS: ${ARGUS_ACTIVITY_WARN_SECONDS:-120}
      ARGUS_ACTIVITY_STALE_SECONDS: ${ARGUS_ACTIVITY_STALE_SECONDS:-300}
      ARGUS_OCR_EVENT_PROTOCOL: ${ARGUS_OCR_EVENT_PROTOCOL:-0}
      OCR_PROCESS_TIMEOUT_SECONDS: ${OCR_PROCESS_TIMEOUT_SECONDS:-1800}
      OCR_TIMEOUT_MINUTES: ${OCR_TIMEOUT_MINUTES:-30}
      OCR_MAX_TOKENS_BUDGET: ${OCR_MAX_TOKENS_BUDGET:-1000000}
      ARGUS_WORKER_LEASE_SECONDS: ${ARGUS_WORKER_LEASE_SECONDS:-300}
      ARGUS_GIT_TIMEOUT_SECONDS: ${ARGUS_GIT_TIMEOUT_SECONDS:-600}
      ARGUS_MAX_REPOSITORY_BYTES: ${ARGUS_MAX_REPOSITORY_BYTES:-1073741824}
      ARGUS_MAX_REPOSITORY_FILES: ${ARGUS_MAX_REPOSITORY_FILES:-50000}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:?set ARGUS_LLM_BASE_URL}
      ARGUS_LLM_API_KEY: ${ARGUS_LLM_API_KEY:?set ARGUS_LLM_API_KEY}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:?set ARGUS_LLM_MODEL}
      ARGUS_LLM_PROTOCOL: ${ARGUS_LLM_PROTOCOL:-openai}
      OCR_BINARY: ${OCR_BINARY:-/usr/local/bin/ocr}
    volumes:
      - argus-service-data:/var/lib/argus
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/var/lib/argus/worker.heartbeat'); raise SystemExit(0 if p.is_file() and time.time()-p.stat().st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  argus-service-data:
