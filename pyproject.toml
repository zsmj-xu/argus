[project]
name = "argus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "anthropic>=0.116.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.21", "mypy>=1.11", "types-PyYAML>=6"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
include = ["argus*"]
exclude = ["targets*", "ground_truth*", "tests*"]

[tool.ruff]
line-length = 120
extend-exclude = ["targets"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
