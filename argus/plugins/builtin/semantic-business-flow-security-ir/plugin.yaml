apiVersion: argus.security/v2
kind: semantic_adapter
metadata:
  id: semantic.business-flow-to-security-ir
  version: 1.0.0
entrypoint: argus.security_ir.business_flow_adapter:business_flow_to_security_ir_runtime
consumes:
  - capability: legacy.enrichment.business-flow.v1
    required: true
  - capability: code.graph.codegraph.v1
    required: true
produces:
  - capability: security.routes.v1
    artifactType: security.routes
    schemaVersion: "1.0"
  - capability: security.business-flow.v1
    artifactType: security.business-flow
    schemaVersion: "1.0"
  - capability: security.authorization.v1
    artifactType: security.authorization
    schemaVersion: "1.0"
  - capability: security.resources.v1
    artifactType: security.resources
    schemaVersion: "1.0"
  - capability: security.graph.v1
    artifactType: security.graph
    schemaVersion: "1.0"
outputSchemas:
  security.routes.v1:
    type: object
    required: [nodes, edges]
    properties:
      nodes: {type: array}
      edges: {type: array}
    additionalProperties: false
  security.business-flow.v1:
    type: object
    required: [nodes, edges]
    properties:
      nodes: {type: array}
      edges: {type: array}
    additionalProperties: false
  security.authorization.v1:
    type: object
    required: [nodes, edges]
    properties:
      nodes: {type: array}
      edges: {type: array}
    additionalProperties: false
  security.resources.v1:
    type: object
    required: [nodes, edges]
    properties:
      nodes: {type: array}
      edges: {type: array}
    additionalProperties: false
permissions:
  source: none
  network: none
  subprocess: none
  secrets: none
runtime:
  isolation: process
  timeoutSeconds: 300
