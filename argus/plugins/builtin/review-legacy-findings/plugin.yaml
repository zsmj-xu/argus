apiVersion: argus.security/v2
kind: review_gate
metadata:
  id: review.legacy-findings
  version: 1.0.0
entrypoint: argus.plugins.legacy_runtime:review_gate_runtime
consumes:
  - capability: legacy.findings.aggregate.v1
    required: true
produces:
  - capability: legacy.findings.reviewed.v1
    artifactType: legacy.findings.reviewed
    schemaVersion: "1.0"
permissions:
  source: none
  network: none
  subprocess: none
  secrets: none
runtime:
  isolation: process
  timeoutSeconds: 300
