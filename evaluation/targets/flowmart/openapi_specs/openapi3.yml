openapi: 3.0.0
info:
  title: flowmart API
  version: "1.0"
  description: >
    钱包 + 二手市场 API。多步业务流逻辑漏洞靶场。
    security 段表示该路由"意图上"是否需要登录;handler 内部的 ownership/role/
    幂等校验是否写对,需读源码判断(这正是漏洞所在)。

components:
  securitySchemes:
    tokenAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, example: mallory}
        password: {type: string, example: Test1234!}
        role: {type: string, enum: [user, admin], example: admin}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, example: alice}
        password: {type: string, example: alice-pw}
    ListingRequest:
      type: object
      required: [title, price]
      properties:
        title: {type: string, example: second-hand camera}
        price: {type: integer, minimum: 1, example: 5000}
    OrderRequest:
      type: object
      required: [listing_id]
      properties:
        listing_id: {type: integer, example: 1}
    CouponIssueRequest:
      type: object
      required: [code, issued_to, amount]
      properties:
        code: {type: string, example: TEST50}
        issued_to: {type: integer, example: 1}
        amount: {type: integer, example: 5000}
    CouponRedeemRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, example: WELCOME50}

paths:
  /users/register:
    post:
      summary: 注册新用户
      operationId: api.users.register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200': {description: ok}

  /users/login:
    post:
      summary: 登录
      operationId: api.users.login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: ok}

  /users/me:
    get:
      summary: 查看自己的资料
      security: [{tokenAuth: []}]
      operationId: api.users.get_me
      responses:
        '200': {description: ok}

  /users:
    get:
      summary: 列出所有用户(管理功能)
      security: [{tokenAuth: []}]
      operationId: api.users.list_users
      responses:
        '200': {description: ok}

  /wallets/{user_id}:
    get:
      summary: 查看某钱包余额
      operationId: api.users.get_wallet
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: ok}

  /listings:
    get:
      summary: 浏览在售商品
      operationId: api.listings.list_listings
      responses:
        '200': {description: ok}
    post:
      summary: 挂出商品
      security: [{tokenAuth: []}]
      operationId: api.listings.create_listing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingRequest'}
      responses:
        '200': {description: ok}

  /listings/{listing_id}:
    put:
      summary: 更新商品
      security: [{tokenAuth: []}]
      operationId: api.listings.update_listing
      parameters:
        - {name: listing_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingRequest'}
      responses:
        '200': {description: ok}

  /orders:
    post:
      summary: 下单
      security: [{tokenAuth: []}]
      operationId: api.orders.create_order
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
      responses:
        '200': {description: ok}

  /orders/{order_id}/pay:
    post:
      summary: 付款
      security: [{tokenAuth: []}]
      operationId: api.orders.pay_order
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: ok}

  /orders/{order_id}/ship:
    post:
      summary: 发货
      security: [{tokenAuth: []}]
      operationId: api.orders.ship_order
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: ok}

  /orders/{order_id}/return:
    post:
      summary: 申请退货
      security: [{tokenAuth: []}]
      operationId: api.orders.return_order
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: ok}

  /orders/{order_id}/refund:
    post:
      summary: 退款
      security: [{tokenAuth: []}]
      operationId: api.orders.refund_order
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: ok}

  /coupons/issue:
    post:
      summary: 签发优惠券(管理功能)
      security: [{tokenAuth: []}]
      operationId: api.coupons.issue_coupon
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CouponIssueRequest'}
      responses:
        '200': {description: ok}

  /coupons/redeem:
    post:
      summary: 兑换优惠券
      security: [{tokenAuth: []}]
      operationId: api.coupons.redeem_coupon
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CouponRedeemRequest'}
      responses:
        '200': {description: ok}

  /support/preview:
    get:
      summary: 预览客服消息
      operationId: api.support.preview_message
      parameters:
        - {name: message, in: query, required: true, schema: {type: string}, example: '<script>alert(1)</script>'}
      responses:
        '200':
          description: HTML preview
          content:
            text/html:
              schema: {type: string}
